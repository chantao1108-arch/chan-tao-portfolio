<!doctype html>
<html lang="zh-CN">
<head>

<title>有些城市真的在耗命｜城市适配度测试</title>
<style>
:root{--bg:#090a0f;--panel:#12141c;--text:#f4f1ea;--muted:#9aa0ad;--line:#262a35;--accent:#d9ff63;--danger:#ff6d7a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#1a1b27 0,#090a0f 42%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}.wrap{max-width:760px;margin:0 auto;padding:24px 18px 60px}.card{background:rgba(18,20,28,.94);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 18px 60px rgba(0,0,0,.35)}.eyebrow{font-size:12px;letter-spacing:.15em;color:var(--accent);text-transform:uppercase}h1{font-size:38px;line-height:1.08;margin:12px 0 16px}h2{font-size:26px;line-height:1.2}p{line-height:1.75}.muted{color:var(--muted)}.red{color:var(--danger)}button{width:100%;border:0;border-radius:16px;padding:16px 18px;font-size:16px;font-weight:700;cursor:pointer;background:var(--accent);color:#0b0d10;margin-top:12px}button.secondary{background:#1d202a;color:var(--text);border:1px solid var(--line)}.progress{height:8px;background:#1a1d26;border-radius:999px;overflow:hidden;margin-bottom:18px}.bar{height:100%;background:var(--accent);width:0;transition:.25s}.qnum{font-size:13px;color:var(--muted);margin-bottom:8px}.question{font-size:23px;line-height:1.45;margin-bottom:18px;font-weight:750}.opt{display:block;width:100%;text-align:left;padding:15px 16px;margin:10px 0;background:#171a23;color:var(--text);border:1px solid #2b2f3b;border-radius:16px;font-size:15px;line-height:1.55;cursor:pointer}.hidden{display:none}.pill{display:inline-block;padding:7px 10px;border-radius:999px;background:#20242f;color:#ccd1dc;font-size:12px}.result-title{font-size:30px;margin:8px 0}.tagline{font-size:18px;color:#d9ff63;line-height:1.55}.section{padding-top:18px;margin-top:18px;border-top:1px solid var(--line)}.quote{font-size:20px;line-height:1.6;padding:18px;border-left:3px solid var(--accent);background:#0e1016}.dim{margin:12px 0}.dimhead{display:flex;justify-content:space-between;color:#c9ced8;font-size:13px}.track{height:9px;background:#222632;border-radius:99px;overflow:hidden}.fill{height:100%;background:#eef8c6}.small{font-size:12px}.cover-note{margin:18px 0;padding:14px 16px;background:#0f1118;border:1px solid #252937;border-radius:14px}@media(max-width:520px){h1{font-size:32px}.card{padding:20px}.question{font-size:21px}}
</style>
</head>
<body>
<div class="wrap">
<section id="cover" class="card">
<div class="eyebrow">CITY FIT / 28 QUESTIONS</div>
<h1>有些城市<br>真的在耗命。</h1>
<p>同一个地方，有人越住越开，有人越住越像一台只剩后台进程的电脑。</p>
<p class="muted">这不是“哪里最好”的排行榜。它测的是：你更容易被哪一种城市结构养大，又最容易被哪一种结构慢慢磨掉。</p>
<div class="cover-note"><b>你会得到：</b><br>主城市原型 + 副匹配原型 + 7项城市偏好 + 代表城市 + 一条黑暗预言。</div>
<p class="small muted">娱乐与自我探索用途。结果不构成移居、法律、财务、医疗或职业建议。</p>
<button id="startBtn" type="button">开始测试</button>
</section>
<section id="quiz" class="card hidden"><div class="progress"><div class="bar" id="bar"></div></div><div class="qnum" id="qnum"></div><div class="question" id="qtext"></div><div id="options"></div><button class="secondary hidden" id="back" type="button">上一题</button></section>
<section id="result" class="card hidden"><div class="eyebrow">YOUR CITY ARCHETYPE</div><div class="result-title" id="rname"></div><div class="tagline" id="rtag"></div><div class="section"><span class="pill">代表城市</span><p id="rcities"></p></div><div class="section"><h2>为什么是你</h2><p id="rbody"></p></div><div class="section"><h2 class="red">黑暗预言</h2><p id="rdark"></p></div><div class="section"><h2>现实里真正该看什么</h2><p id="rfit"></p></div><div class="section"><h2>你的 7 项城市偏好</h2><div id="dims"></div></div><div class="section"><h2>副匹配</h2><p id="second"></p></div><div class="section"><div class="quote" id="rshare"></div></div><button id="copyBtn" type="button">复制结果文案</button><button class="secondary" id="restartBtn" type="button">重新测试</button></section>
</div>
<script>
const Q=[['G','如果两份工作摆在你面前，你第一反应更想选哪一个？',[['收入普通，但稳定、可预期，几年后大概也能想象得到。',0],['稳定为主，但最好每年还能明显往上走一点。',1],['风险高一点没关系，只要上升空间够大。',3],['我会先看机会密度，哪边更容易遇到下一扇门就去哪边。',2]]],['G','你对“城市竞争很激烈”这句话的真实反应是？',[['听着就累，我不想把生活过成长期比赛。',0],['可以有竞争，但别侵入生活的每个角落。',1],['有点兴奋。至少说明机会和厉害的人也多。',3],['看回报。如果卷半天没有杠杆，我宁可走。',2]]],['G','如果你五年后还住在同一座城市，你最不能接受的是？',[['生活没有变得更舒服。',1],['收入、资源、选择权几乎没变。',3],['我已经习惯这里，倒也没什么不能接受。',0],['没积累出能带走的东西——钱、能力、人脉或资产。',2]]],['G','假设你已经财务安全，你还会不会主动往更大的平台走？',[['不会，我会优先把生活过舒服。',0],['偶尔会，但得值得。',1],['会。资源密度和更大的局面本身就吸引我。',3],['会，但我更想站到能调动资源的位置，而不是一直亲自冲。',2]]],['S','一座城市的规则经常变化，你会？',[['挺刺激，说明还有缝隙和机会。',0],['只要信息透明，我能适应。',1],['会明显消耗我，我更喜欢规则长期稳定。',3],['能忍，但我会给自己留退出方案。',2]]],['S','你对公共医疗、社会保障、劳动规则这类“制度托底”的重视程度？',[['很高。平时用不到也希望它在那里。',3],['重要，但不能为了托底牺牲太多机会。',2],['一般，我更相信自己的现金和选择权。',1],['很低，我宁可自己承担风险换自由。',0]]],['S','如果一个地方机会很多，但你总担心“规则明天会不会变”，你能住多久？',[['很久，只要钱够多。',0],['可以住一阵，但不会把全部人生压上去。',1],['我会很快想找更确定的地方。',3],['能住，但必须同时建立第二落点。',2]]],['S','你更喜欢哪种人生底盘？',[['下限很高：不容易掉下去。',3],['上限很高：有可能一下冲出去。',0],['下限不能太差，上限也得留口子。',2],['我更在意自己能随时换轨。',1]]],['D','高楼、地铁、人群、灯牌、深夜还亮着的街，对你来说更像？',[['充电器。城市醒着，我也会醒。',3],['偶尔很爽，长期会累。',2],['能接受，但我不依赖这些。',1],['背景噪音。我更想要空间和安静。',0]]],['D','你能接受“楼下什么都有，但窗外永远有人”的生活吗？',[['非常能，便利优先。',3],['能，只要家里足够私密。',2],['短期可以，长期想逃。',1],['不行，我需要低密度。',0]]],['D','如果一家店晚上 9 点就关门、周日很多地方不营业，你会？',[['挺好，大家都该休息。',0],['有点不方便，但能适应。',1],['会觉得城市没劲。',2],['受不了，我喜欢随时能解决问题的城市。',3]]],['D','你更喜欢哪种“城市安全感”？',[['走几步就有人、有店、有交通。',3],['该热闹时热闹，回家能安静。',2],['人少、空间大、互不打扰。',0],['我不在乎热不热闹，只要效率高。',1]]],['A','你最受不了哪种生活环境？',[['大家都来管你的私事。',3],['规则很多但解释不清。',2],['人与人太疏离。',0],['所有人都只顾自己。',1]]],['A','理想工作状态更接近？',[['明确分工，照流程做完就好。',0],['有框架，但我能自己决定怎么做。',2],['尽量没人管我，我对结果负责。',3],['团队一起做，我不介意频繁沟通。',1]]],['A','你对“邻里关系很紧密、大家互相照应”是什么感觉？',[['很温暖，我喜欢。',0],['可以，但不要天天来往。',1],['听起来已经开始有压力了。',2],['我只想礼貌点头，别进入彼此生活。',3]]],['A','周末完全没有安排时，你最舒服的状态是？',[['自己消失一天，没人找我。',3],['自己安排，但可以临时见想见的人。',2],['最好有人约我，不然有点空。',0],['看心情，独处社交都行。',1]]],['C','如果一座城市很赚钱，但街道、建筑、天气、日常视觉都让你无感，你能待多久？',[['钱够就能待，审美不是重点。',0],['可以几年，但不会想在那里老去。',1],['会越来越烦，生活质感对我影响很大。',3],['我会把它当赚钱基地，同时寻找真正想住的地方。',2]]],['C','旅行时你最容易记住什么？',[['效率：交通、服务、动线。',0],['机会：这里的人都在做什么。',1],['气味、光线、街角、建筑和食物。',3],['一种说不清的城市气质。',2]]],['C','你能为了更好看的自然环境或更舒服的城市质感，接受收入机会少一点吗？',[['完全不能。',0],['一点点可以。',1],['可以，生活不是只有收入。',2],['很可以，我住在哪里会直接影响我的状态。',3]]],['C','下面哪种东西更容易让你突然觉得“我想住在这里”？',[['公司总部、产业和机会。',0],['干净、秩序、效率。',1],['一条好看的街、一家小店、树影、河、山或海。',3],['当地人的生活方式让我羡慕。',2]]],['M','如果未来十年你换三个国家生活，你会觉得？',[['太折腾了，我希望尽快定下来。',0],['如果有必要可以。',1],['听起来挺正常，人生本来就可以分阶段。',2],['甚至有点期待，我不想把一生锁死在一个地方。',3]]],['M','“故乡/扎根”对你的约束力有多强？',[['很强，我最终还是希望回到熟悉的地方。',0],['有感情，但不会决定我住哪里。',1],['很弱，哪里更适合我就去哪里。',3],['我可以同时拥有几个长期据点。',2]]],['M','如果发现一座城市已经不适合你，你更可能？',[['再熬几年，换地方成本太高。',0],['先观察，确认不是自己一时不爽。',1],['开始收集信息，给自己准备出口。',2],['只要判断清楚，我会尽快走。',3]]],['M','你理想中的“家”更像？',[['一个固定地址，住很多很多年。',0],['一个主基地，偶尔长期旅行。',1],['两三个可以切换的据点。',2],['家是我自己，不是某个地点。',3]]],['W','你喜欢陌生人之间有一点闲聊和人情味吗？',[['喜欢，会让我觉得世界有人味。',3],['适量可以。',2],['无所谓。',1],['最好别聊，各办各的事最舒服。',0]]],['W','如果一个地方人人守边界、效率高，但关系偏冷，你会？',[['太好了，正合我意。',0],['可以，我自己有亲近的人就够了。',1],['久了会觉得有点孤单。',2],['不行，我需要更有温度的日常。',3]]],['W','你更喜欢哪种社区？',[['互不打扰，公共规则清楚。',0],['礼貌疏离，需要时能找到服务。',1],['偶尔会认识附近的人，但边界还在。',2],['店主记得你、邻居会聊天、生活有熟人感。',3]]],['W','一座城市让你留下来的理由里，“人”占多大比重？',[['很少。城市结构合适就行。',0],['有一些，但不是决定性。',1],['挺大，关系会改变我对城市的感受。',2],['很大，没有连接感，再好的城市也像临时住处。',3]]]];
const P=[['燃烧引擎型','你不是来休息的，你是来把人生推上更高一层的。','纽约 · 伦敦 · 旧金山',[95,55,90,70,55,70,40],'你对城市最隐秘的要求不是舒服，而是这里能不能让我变得更大。机会密度、人才密度、信息速度和向上通道会直接决定你对一座城有没有感觉。','你最容易被“舒服但没有下一层”的城市慢慢麻醉。最可怕的不是累，而是三年过去，你过得不差，却发现自己的资源、选择权和半径几乎没变。','真正要检查的是行业机会密度、收入上限和换轨空间。','别人搬家是换地址，你搬家最好是在换人生杠杆。'],['精密秩序型','你不怕规则，你怕的是规则既多又不靠谱。','苏黎世 · 维也纳 · 慕尼黑',[65,95,45,80,65,30,35],'你需要的是世界大致按说明书运行的感觉。清晰边界、稳定制度和私人空间，会让你的脑子腾出位置去做真正重要的事。','长期住在高不确定环境里，你会为每个最坏结果偷偷留后手，最后被预付的精力耗掉。','重点查长期居留、税负、住房、语言与职业准入。','你不是保守，你只是拒绝把人生交给随机数生成器。'],['高密便利型','你要的不是热闹，是世界随叫随到。','东京 · 台北 · 首尔',[70,75,95,45,75,45,50],'你喜欢随时能吃东西、公共交通够密、街区有层次的城市。你未必喜欢社交，但喜欢周围一直有生活发生。','你最容易死在“安静但什么都要开车二十分钟”的地方，无数微小摩擦会磨掉兴致。','看步行半径、公共交通、夜间服务和第三空间。','你不是离不开城市，你只是受不了生活每一步都要预约。'],['自然回血型','你可以拼，但你不能永远待在战场中央。','温哥华 · 墨尔本 · 奥克兰',[55,80,40,85,85,50,55],'你需要空间、自然、私人边界和稳定公共系统，才能长期做事。','危险在于你很能扛，所以会把“我还能继续”误认为“这里适合我”。','看自然可达性、通勤、住房空间、工作文化和身份稳定度。','适合你的城市，不是让你赢得最快，而是让你还有力气赢很多年。'],['感官松弛型','你的人生如果长期不好看，你真的会慢慢枯掉。','里斯本 · 巴塞罗那 · 佛罗伦萨',[40,50,55,75,100,65,85],'光线、建筑、天气、食物和街道气质会一点点改变你的状态。你需要生活本身有质地。','你会在“所有指标都不错但就是不喜欢”的地方困很久，然后把环境造成的萎靡误诊成自己没动力。','核对就业、工资房租、签证、语言和常住体验。','你不是矫情。你只是没办法长期住在一个对感官毫无回报的地方。'],['北境静稳型','你要的自由不是热闹，是没人来烦你。','哥本哈根 · 赫尔辛基 · 斯德哥尔摩',[50,95,30,90,70,35,30],'你喜欢规则清楚、空间够用、别人尊重边界，不需要靠高频社交证明归属。','在高人情高噪音环境里，你会被每天的碎片化打断慢慢耗空。','验证冬季光照、语言、社会融入和成本。','你不是冷淡，你只是希望世界别天天敲你的门。'],['全球跳板型','你对城市没有忠诚，你对下一张牌有忠诚。','新加坡 · 香港 · 迪拜',[95,65,80,75,40,100,35],'你会把城市看成节点：身份、行业、资金、人脉、航线和下一站。住哪里对你更像资产配置题。','你可能一路升级，却突然发现自己拥有很多入口，没有一个真正想回去的地方。','看税务、身份、跨境金融、行业准入和退出成本。','有的人找故乡，你更像是在搭自己的全球传送点。'],['人间烟火型','你可以没有宏大叙事，但日子必须活着。','曼谷 · 清迈 · 吉隆坡',[45,40,60,75,80,85,95],'你适合有温度、有缝隙、有一点随机性的城市，日常快乐容易获得。','在过度精密冷静的城市里，你可能变成“功能正常的人”，但每天少一点活着的感觉。','长期仍要核对签证、医疗、气候、收入来源和基础设施。','你要的不是躺平，是别让每一天都像在运行企业后台。']];
const K=['G','S','D','A','C','M','W'],N=['机会/增长饥饿','稳定/制度需求','密度/刺激耐受','自主/边界需求','感官/生活质地','迁徙/流动倾向','人情/连接需求'];let i=0,a=[];
function render(){let q=Q[i];document.getElementById('qnum').textContent=(i+1)+' / 28';document.getElementById('qtext').textContent=q[1];document.getElementById('bar').style.width=i/28*100+'%';let opts=document.getElementById('options');opts.innerHTML='';q[2].forEach((o,j)=>{let b=document.createElement('button');b.className='opt';b.textContent=o[0];b.onclick=()=>{a[i]=j;if(i<27){i++;render();window.scrollTo({top:0,behavior:'smooth'})}else showResult()};opts.appendChild(b)});document.getElementById('back').classList.toggle('hidden',i===0)}
function showResult(){let s=K.map(k=>{let sum=0,c=0;Q.forEach((q,x)=>{if(q[0]===k){sum+=q[2][a[x]][1];c++}});return Math.round(sum/(c*3)*100)});let ranked=P.map(p=>[p,Math.sqrt(p[3].reduce((z,v,x)=>z+(s[x]-v)**2,0))]).sort((x,y)=>x[1]-y[1]);let p=ranked[0][0],p2=ranked[1][0];document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('rname').textContent=p[0];document.getElementById('rtag').textContent=p[1];document.getElementById('rcities').textContent=p[2];document.getElementById('rbody').textContent=p[4];document.getElementById('rdark').textContent=p[5];document.getElementById('rfit').textContent=p[6];document.getElementById('rshare').textContent='“'+p[7]+'”';document.getElementById('second').innerHTML='你的第二城市原型是 <b>'+p2[0]+'</b>（'+p2[2]+'）。';document.getElementById('dims').innerHTML=s.map((v,x)=>'<div class="dim"><div class="dimhead"><span>'+N[x]+'</span><span>'+v+'</span></div><div class="track"><div class="fill" style="width:'+v+'%"></div></div></div>').join('');window.last=[p,p2]}
document.getElementById('startBtn').onclick=()=>{document.getElementById('cover').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render()};document.getElementById('back').onclick=()=>{if(i){i--;render()}};document.getElementById('restartBtn').onclick=()=>location.reload();document.getElementById('copyBtn').onclick=()=>{let t='我的城市原型：'+window.last[0][0]+'\n代表城市：'+window.last[0][2]+'\n'+window.last[0][7];if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>alert('已复制')).catch(()=>prompt('复制结果：',t))}else prompt('复制结果：',t)};
</script>
</body></html>
